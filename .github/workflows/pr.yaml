name: bag-pr-ci

on: [push]

jobs:
  build_pybag:
    runs-on: ubuntu-20.04
    defaults:
      run:
        shell: bash -el {0}
    continue-on-error: true
    outputs:
      pytestOutput: ${{ steps.unit-tests.outputs.test }}
      mypyOutput: ${{ steps.type-checks.outputs.test }}
    strategy:
      matrix:
        python-version: ["3.7"]
    steps:
      - name: Checkout submodule
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Get pybag commit string
        run: |
          cd pybag
          export PYBAG_COMMIT="$(git rev-parse HEAD)"
          echo $PYBAG_COMMIT
          echo "PYBAG_COMMIT=$PYBAG_COMMIT" >> "$GITHUB_ENV"
      - name: Cache pybag
        id: cache-pybag
        uses: actions/cache@v3
        with:
          path: pybag/_build
          key:
            pybag-${{ runner.os }}--${{ runner.arch }}--${{
            hashFiles('environment.yml') }}-${{
            env.PYBAG_COMMIT }}
        env:
            # Increase this value to reset cache if etc/example-environment.yml has not changed
            CACHE_NUMBER: 0
      - name: Install packages
        if: steps.cache-pybag.outputs.cache-hit != 'true'
        run: |
          sudo apt update
          sudo apt -y install \
            autoconf \
            curl \
            gcc-8 \
            g++-8 \
            git \
            libtool \
            libltdl-dev \
            pkg-config \
            make \
      - name: Setup conda
        if: steps.cache-pybag.outputs.cache-hit != 'true'
        uses: conda-incubator/setup-miniconda@v3.0.4
        with:
          activate-environment: bag_py3d7_c
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yml
          auto-activate-base: false
      - name: Cache Conda env
        if: steps.cache-pybag.outputs.cache-hit != 'true'
        uses: actions/cache@v3
        with:
          path: ${{ env.CONDA }}/envs
          key:
            conda-${{ runner.os }}--${{ runner.arch }}--${{
            steps.get-date.outputs.today }}-${{
            hashFiles('environment.yml') }}-${{
            env.CACHE_NUMBER }}
        env:
          # Increase this value to reset cache if etc/example-environment.yml has not changed
          CACHE_NUMBER: 0
        id: cache
      - name: Update environment
        if: steps.cache-pybag.outputs.cache-hit != 'true'
        run: |
          echo "env.conda=${{ env.CONDA }}"
          conda env update -n bag_py3d7_c -f environment.yml
      - name: Install additional dependencies
        if: steps.cache-pybag.outputs.cache-hit != 'true'
        run: |
          cd pybag/setup
          mkdir install
          cp setup_script.sh install/
          cp render_template.py install/
          cp project-config.template install/
          cd install
          ./setup_script.sh
      - name: Update environment variables
        if: steps.cache-pybag.outputs.cache-hit != 'true'
        run: |
          export PYBAG_PYTHON=python
          which $PYBAG_PYTHON
          echo "PYBAG_PYTHON=$PYBAG_PYTHON" >> "$GITHUB_ENV"
      - name: Build pybag
        if: steps.cache-pybag.outputs.cache-hit != 'true'
        id: cpp-build
        run: |
          which python
          echo $PYBAG_PYTHON
          cd pybag
          python setup.py build
  tests:
    needs: build_pybag
    env:
      PYTHONPATH: "tests:pybag/_build/lib:src"
    defaults:
      run:
        shell: bash -el {0}
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      pytestOutput: ${{ steps.unit-tests.outputs.test }}
      mypyOutput: ${{ steps.type-checks.outputs.test }}
    strategy:
      matrix:
        python-version: ["3.7"]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Setup conda
        uses: conda-incubator/setup-miniconda@v3.0.4
        with:
          activate-environment: bag_py3d7_c
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yml
          auto-activate-base: false
      - name: Cache Conda env
        uses: actions/cache@v4
        with:
          path: ${{ env.CONDA }}/envs
          key:
            conda-${{ runner.os }}--${{ runner.arch }}--${{
            steps.get-date.outputs.today }}-${{
            hashFiles('environment.yml') }}-${{
            env.CACHE_NUMBER }}
        env:
          # Increase this value to reset cache if etc/example-environment.yml has not changed
          CACHE_NUMBER: 0
        id: cache
      - name: Update environment
        run:
          conda env update -n bag_py3d7_c -f
          environment.yml
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Activate environment
        run: |
          conda init
          conda activate bag_py3d7_c 
      - name: Get pybag commit string
        run: |
          cd pybag
          export PYBAG_COMMIT="$(git rev-parse HEAD)"
          echo $PYBAG_COMMIT
          echo "PYBAG_COMMIT=$PYBAG_COMMIT" >> "$GITHUB_ENV"
      - name: Cache pybag
        id: cache-pybag
        uses: actions/cache@v3
        with:
          path: pybag/_build
          key:
            pybag-${{ runner.os }}--${{ runner.arch }}--${{
            hashFiles('environment.yml') }}-${{
            env.PYBAG_COMMIT }}
        env:
            # Increase this value to reset cache if etc/example-environment.yml has not changed
            CACHE_NUMBER: 0
      # - name: Setup env vars
      #   run: | 
      #     echo "PYTHONPATH=src" >> "$GITHUB_ENV"
      #     echo "PYTHONPATH=${PYTHONPATH}:pybag/_build/lib" >> "$GITHUB_ENV"
      #     echo "PYTHONPATH=${PYTHONPATH}:tests" >> "$GITHUB_ENV"
      - name: Run unit tests
        id: unit-tests
        run: |
          pytest tests/ -v
